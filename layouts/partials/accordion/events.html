{{ range sort .Site.Params.events.list "date" "desc" }}
<div class="event-item mb-6 pb-6 border-b border-stone-200 dark:border-stone-800">
  <div class="flex flex-col md:flex-row md:items-start gap-3">
    <span class="micro-label md:w-24 md:flex-shrink-0 md:pt-1">{{ .date }}</span>
    {{ if .image }}
    <div class="flex-shrink-0 self-start">
      <img src="{{ .image | relURL }}" alt="{{ .title }}" class="w-16 h-12 object-cover border border-stone-200 dark:border-stone-800">
    </div>
    {{ end }}
    <div class="flex-1">
      <h4 class="text-base font-medium mb-1">
        {{ if .link }}<a href="{{ .link }}" class="text-stone-900 dark:text-stone-100">{{ .title }}</a>
        {{ else }}{{ .title }}{{ end }}
      </h4>
      {{ if .description }}
      <p class="text-stone-500 dark:text-stone-400 mb-0 mt-1 text-sm">{{ .description | markdownify }}</p>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
