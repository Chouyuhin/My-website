<div class="profile-card p-6 text-center dark:text-stone-300 text-stone-900">
  <img
    class="mx-auto mb-5 w-full"
    src="{{ `images` | relURL }}/{{ .Site.Params.profile.photo }}"
    alt="{{ .Site.Params.author }}"
    style="width: 100%; max-width: 100%; max-height: 550px; height: auto; object-fit: contain;"
  />
  <h1 class="text-xl font-medium mb-1 dark:text-stone-100 text-stone-900" style="font-family: 'Shippori Mincho', serif;">{{ .Site.Params.profile.name }}</h1>
  <p class="text-sm dark:text-stone-400 text-stone-600 mb-3">{{ .Site.Params.profile.tagline }}</p>
  <p class="micro-label">{{ .Site.Params.profile.location }}</p>
</div>
