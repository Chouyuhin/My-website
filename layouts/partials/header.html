<header
  class="nav flex flex-row row py-3 mb-10 w-full border-b border-stone-200 dark:border-stone-800 justify-between items-center"
>
  <div>
    <a class="no-underline py-2 pr-5" href="{{ .Site.BaseURL }}">Home</a>
    <a class="no-underline py-2 pr-5" href="{{ `blog` | relURL }}">Blog</a>
    <a class="no-underline py-2 pr-5" href="{{ `publications` | relURL }}">Publications</a>
    <a class="no-underline py-2 pr-5" href="{{ `events` | relURL }}">Events</a>
  </div>
  <div>
  <a class="mr-5 no-underline" href="{{ `search` | relURL }}"><i class="fas fa-search text-sm"></i></a>
  <i
    class="fas fa-sun theme-toggle text-stone-400 hover:text-stone-900 dark:text-stone-500 dark:hover:text-stone-100 cursor-pointer text-base mr-9 sm:mr-0"
    onclick="lightDark(this)"
  ></i>
</div>
</header>

<script>
  const lightDark = (el) => {
    let html = document.querySelector("html");
    if (html.classList.contains("dark")) {
      html.classList.remove("dark");
      el.classList.add("fa-moon");
      el.classList.remove("fa-sun");
      window.localStorage.setItem("theme", "light");
    } else {
      html.classList.add("dark");
      el.classList.add("fa-sun");
      el.classList.remove("fa-moon");
      window.localStorage.setItem("theme", "dark");
    }
  };
</script>
